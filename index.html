<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Demos</title>
<style>
  :root {
    --bg: #121212;
    --card: #1b1b1b;
    --ink: #ECEAE4;
    --ink-soft: #9A9A94;
    --accent: #74A996;
    --line: #2A2A28;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 64px 24px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; }
  .sub { color: var(--ink-soft); font-size: 0.95rem; margin-bottom: 40px; }
  .list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  a.item {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); padding: 20px 22px; text-decoration: none; color: var(--ink);
    transition: background .15s;
  }
  a.item:hover { background: #222220; }
  .item-name { font-weight: 600; font-size: 1.02rem; }
  .item-tag { color: var(--ink-soft); font-size: 0.82rem; margin-top: 3px; }
  .arrow { color: var(--accent); font-size: 1.1rem; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Site Demos</h1>
    <p class="sub">Live concept builds — each one a from-scratch design pitch.</p>
    <div class="list">
      <a class="item" href="./anchorstone-exteriors/">
        <span>
          <div class="item-name">Anchorstone Exteriors</div>
          <div class="item-tag">Home services · exterior restoration</div>
        </span>
        <span class="arrow">&#8594;</span>
      </a>
    </div>
  </div>
</body>
</html>
